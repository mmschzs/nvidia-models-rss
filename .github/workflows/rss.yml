name: Generate and Deploy Multi-Source Models RSS

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: "rss-pages"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Pinned to commit SHAs: mutable tags on a public repo let an upstream
      # compromise run arbitrary code in a job that holds DMX_API_KEY and a
      # write-capable GITHUB_TOKEN. Bump by resolving the tag again, never by
      # editing the SHA by hand.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch models from all sources and generate feeds
        env:
          # Optional: without it the DMXAPI source is skipped.
          DMX_API_KEY: ${{ secrets.DMX_API_KEY }}
        run: |
          python fetch_feeds.py

      - name: Persist first-seen state (sources without timestamps)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "chore: update first-seen state [skip ci]"
          git push

      - name: Deploy feeds to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          commit_message: "Automated Feed Update [skip ci]"
